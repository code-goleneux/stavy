<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Stavy — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:    #0f0a1e;
      --v900:   #4c1d95;
      --v700:   #6d28d9;
      --v500:   #8b5cf6;
      --v400:   #a78bfa;
      --v200:   #ddd6fe;
      --v50:    #f5f3ff;
      --red:    #dc2626;
      --green:  #16a34a;
      --yellow: #d97706;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0f0a1e;
      color: #fff;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── PIN SCREEN ──────────────────────────────────────── */
    #pin-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(145deg, #1e0a3c 0%, #2d1060 50%, #1a0838 100%);
    }

    .pin-logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin-bottom: 8px;
    }
    .pin-logo span { color: var(--v400); }

    .pin-bar-name {
      font-size: 14px;
      color: rgba(167,139,250,0.6);
      margin-bottom: 40px;
      text-align: center;
    }

    .pin-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 32px 28px;
      width: 100%;
      max-width: 340px;
      text-align: center;
    }

    .pin-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .pin-sub {
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 28px;
    }

    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 24px;
    }
    .pin-dot {
      width: 16px; height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(167,139,250,0.4);
      background: transparent;
      transition: all 0.15s;
    }
    .pin-dot.filled {
      background: var(--v400);
      border-color: var(--v400);
    }

    .pin-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .pin-key {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 18px 0;
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: background 0.1s, transform 0.1s;
      user-select: none;
      -webkit-user-select: none;
    }
    .pin-key:active { background: rgba(139,92,246,0.3); transform: scale(0.96); }
    .pin-key.del { font-size: 16px; color: rgba(255,255,255,0.5); }
    .pin-key.zero { grid-column: 2; }

    .pin-error {
      margin-top: 16px;
      font-size: 13px;
      color: #f87171;
      min-height: 20px;
      transition: opacity 0.2s;
    }

    /* ── MAIN DASHBOARD ─────────────────────────────────── */
    #dashboard { display: none; }

    .dash-nav {
      background: rgba(15,10,30,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 0 20px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-logo { font-size: 20px; font-weight: 800; letter-spacing: -0.04em; }
    .nav-logo span { color: var(--v400); }
    .nav-bar { font-size: 13px; color: rgba(255,255,255,0.45); }
    .nav-out {
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.2s;
    }
    .nav-out:hover { color: #fff; border-color: rgba(255,255,255,0.3); }

    .dash-body { padding: 20px 16px; max-width: 680px; margin: 0 auto; }

    /* Stats */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 14px 12px;
      text-align: center;
    }
    .stat-val {
      font-size: 22px;
      font-weight: 700;
      color: var(--v400);
      letter-spacing: -0.03em;
    }
    .stat-label {
      font-size: 10px;
      color: rgba(255,255,255,0.4);
      margin-top: 4px;
      line-height: 1.3;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 4px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 8px 4px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: rgba(255,255,255,0.4);
      transition: all 0.2s;
    }
    .tab.active {
      background: var(--v700);
      color: #fff;
    }

    /* Review cards */
    .review-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    .review-card.respondida {
      opacity: 0.55;
      border-color: rgba(22,163,74,0.2);
    }

    .review-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 8px;
    }
    .review-author { font-size: 14px; font-weight: 600; }
    .review-date { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 2px; }
    .review-stars { font-size: 16px; flex-shrink: 0; }

    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.03em;
      margin-bottom: 10px;
    }
    .badge-negativo  { background: rgba(220,38,38,0.15);  color: #f87171; border: 1px solid rgba(220,38,38,0.2); }
    .badge-mixto     { background: rgba(217,119,6,0.15);  color: #fbbf24; border: 1px solid rgba(217,119,6,0.2); }
    .badge-positivo  { background: rgba(22,163,74,0.15);  color: #4ade80; border: 1px solid rgba(22,163,74,0.2); }
    .badge-neutro    { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.1); }
    .badge-respondida{ background: rgba(22,163,74,0.12);  color: #4ade80; border: 1px solid rgba(22,163,74,0.2); }

    .review-text {
      font-size: 13px;
      color: rgba(255,255,255,0.65);
      line-height: 1.6;
      margin-bottom: 12px;
      font-style: italic;
    }

    /* Acordeón respuesta */
    .resp-toggle {
      font-size: 12px;
      color: var(--v400);
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 8px;
      user-select: none;
    }
    .resp-toggle .arrow { transition: transform 0.2s; display: inline-block; }
    .resp-toggle.open .arrow { transform: rotate(90deg); }

    .resp-box {
      display: none;
      background: rgba(109,40,217,0.12);
      border: 1px solid rgba(109,40,217,0.25);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: rgba(255,255,255,0.8);
      line-height: 1.65;
      margin-bottom: 12px;
    }
    .resp-box.open { display: block; }

    /* Botones acción */
    .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn-respond {
      flex: 1;
      min-width: 0;
      background: var(--v700);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .btn-respond:hover { background: var(--v500); }

    .btn-done {
      background: rgba(22,163,74,0.15);
      color: #4ade80;
      border: 1px solid rgba(22,163,74,0.25);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-done:hover { background: rgba(22,163,74,0.25); }
    .btn-done.active {
      background: rgba(22,163,74,0.2);
      color: #4ade80;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1e1b4b;
      border: 1px solid rgba(109,40,217,0.4);
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      z-index: 999;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* Estado vacío */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: rgba(255,255,255,0.3);
    }
    .empty-state p { font-size: 14px; margin-top: 8px; }

    /* Loading */
    .loading {
      text-align: center;
      padding: 40px;
      color: rgba(255,255,255,0.3);
      font-size: 14px;
    }

    @media (max-width: 360px) {
      .stats-row { grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .stat-val { font-size: 18px; }
    }
  </style>
</head>
<body>

<!-- ── PIN SCREEN ──────────────────────────────────────────── -->
<div id="pin-screen">
  <div class="pin-logo">sta<span>vy</span></div>
  <div class="pin-bar-name" id="pin-bar-name">Cargando...</div>
  <div class="pin-card">
    <p class="pin-title">Introduce tu PIN</p>
    <p class="pin-sub">4 dígitos</p>
    <div class="pin-dots">
      <div class="pin-dot" id="d0"></div>
      <div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div>
      <div class="pin-dot" id="d3"></div>
    </div>
    <div class="pin-pad">
      <button class="pin-key" data-n="1">1</button>
      <button class="pin-key" data-n="2">2</button>
      <button class="pin-key" data-n="3">3</button>
      <button class="pin-key" data-n="4">4</button>
      <button class="pin-key" data-n="5">5</button>
      <button class="pin-key" data-n="6">6</button>
      <button class="pin-key" data-n="7">7</button>
      <button class="pin-key" data-n="8">8</button>
      <button class="pin-key" data-n="9">9</button>
      <button class="pin-key del" id="pin-del">⌫</button>
      <button class="pin-key zero" data-n="0">0</button>
    </div>
    <p class="pin-error" id="pin-error"></p>
  </div>
</div>

<!-- ── DASHBOARD ────────────────────────────────────────────── -->
<div id="dashboard">
  <nav class="dash-nav">
    <div class="nav-logo">sta<span>vy</span></div>
    <div class="nav-bar" id="nav-bar-name"></div>
    <button class="nav-out" onclick="cerrarSesion()">Salir</button>
  </nav>

  <div class="dash-body">
    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-val" id="stat-rating">—</div>
        <div class="stat-label">Rating<br/>medio</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-reviews">—</div>
        <div class="stat-label">Reseñas<br/>totales</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-scans">—</div>
        <div class="stat-label">Scans<br/>NFC (7d)</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" data-tab="pendientes" onclick="setTab(this,'pendientes')">Pendientes</div>
      <div class="tab" data-tab="todas" onclick="setTab(this,'todas')">Todas</div>
      <div class="tab" data-tab="respondidas" onclick="setTab(this,'respondidas')">Respondidas</div>
    </div>

    <!-- Reviews list -->
    <div id="reviews-list">
      <div class="loading">Cargando reseñas...</div>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
  const SUPABASE_URL = 'https://jrwxtgeymticrbkjdixe.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_btdSQPNqgCiTe_zX1VGTBA_wws0jXF2';

  const params = new URLSearchParams(window.location.search);
  const BAR_ID = params.get('bar') || 'alambique-sabina';

  let barData   = null;
  let allReviews = [];
  let activeTab  = 'pendientes';
  let pinBuffer  = '';

  // ── Fetch bar data ────────────────────────────────────────
  async function init() {
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/bares?id=eq.${BAR_ID}&select=nombre,dashboard_pin,rating_inicio,reviews_inicio`,
        { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
      );
      const rows = await res.json();
      if (!rows?.length) { document.getElementById('pin-bar-name').textContent = 'Bar no encontrado'; return; }
      barData = rows[0];
      document.getElementById('pin-bar-name').textContent = barData.nombre;
    } catch(e) {
      document.getElementById('pin-bar-name').textContent = 'Error de conexión';
    }
  }

  // ── PIN logic ─────────────────────────────────────────────
  document.querySelectorAll('.pin-key[data-n]').forEach(btn => {
    btn.addEventListener('click', () => addDigit(btn.dataset.n));
  });
  document.getElementById('pin-del').addEventListener('click', delDigit);

  function addDigit(d) {
    if (pinBuffer.length >= 4) return;
    pinBuffer += d;
    updateDots();
    if (pinBuffer.length === 4) setTimeout(checkPin, 150);
  }

  function delDigit() {
    pinBuffer = pinBuffer.slice(0, -1);
    updateDots();
    document.getElementById('pin-error').textContent = '';
  }

  function updateDots() {
    for (let i = 0; i < 4; i++) {
      document.getElementById(`d${i}`).classList.toggle('filled', i < pinBuffer.length);
    }
  }

  function checkPin() {
    if (!barData) { showPinError('Cargando...'); pinBuffer = ''; updateDots(); return; }
    if (pinBuffer === barData.dashboard_pin) {
      enterDashboard();
    } else {
      showPinError('PIN incorrecto');
      pinBuffer = '';
      updateDots();
    }
  }

  function showPinError(msg) {
    const el = document.getElementById('pin-error');
    el.textContent = msg;
    setTimeout(() => { el.textContent = ''; }, 2000);
  }

  function cerrarSesion() {
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('pin-screen').style.display = 'flex';
    pinBuffer = ''; updateDots();
  }

  // ── Enter dashboard ────────────────────────────────────────
  async function enterDashboard() {
    document.getElementById('pin-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('nav-bar-name').textContent = barData.nombre;
    await loadDashboard();
  }

  async function loadDashboard() {
    await Promise.all([loadReviews(), loadStats()]);
  }

  // ── Load reviews ──────────────────────────────────────────
  async function loadReviews() {
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/reviews?bar_id=eq.${BAR_ID}&order=fecha.desc&limit=100`,
        { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
      );
      allReviews = await res.json();
      renderReviews();
    } catch(e) {
      document.getElementById('reviews-list').innerHTML = '<div class="loading">Error cargando reseñas</div>';
    }
  }

  function renderReviews() {
    const list = document.getElementById('reviews-list');
    let filtered;
    if (activeTab === 'pendientes')  filtered = allReviews.filter(r => !r.respondida);
    else if (activeTab === 'respondidas') filtered = allReviews.filter(r => r.respondida);
    else filtered = allReviews;

    if (!filtered.length) {
      const msgs = {
        pendientes:  '✓ Sin reseñas pendientes',
        respondidas: 'Aún no hay reseñas respondidas',
        todas:       'Aún no hay reseñas registradas'
      };
      list.innerHTML = `<div class="empty-state"><p>${msgs[activeTab]}</p></div>`;
      return;
    }

    list.innerHTML = filtered.map(r => reviewCard(r)).join('');
  }

  function reviewCard(r) {
    const stars = '⭐'.repeat(r.rating || 0) + '☆'.repeat(5 - (r.rating || 0));
    const fecha = r.fecha ? new Date(r.fecha).toLocaleDateString('es-ES', { day:'2-digit', month:'short', year:'numeric' }) : '—';
    const badgeClass = { negativo:'badge-negativo', mixto:'badge-mixto', positivo:'badge-positivo', neutro:'badge-neutro' }[r.sentimiento] || 'badge-neutro';
    const badgeText  = r.sentimiento || 'neutro';
    const texto = r.texto ? `<div class="review-text">"${escHtml(r.texto)}"</div>` : '';
    const doneBtnClass = r.respondida ? 'btn-done active' : 'btn-done';
    const doneText = r.respondida ? '✓ Respondida' : 'Marcar respondida';
    const respondBtn = r.ai_response
      ? `<button class="btn-respond" onclick="copiarYResponder('${escAttr(r.ai_response)}')">📋 Copiar y abrir Google</button>`
      : '';
    const respAccordion = r.ai_response ? `
      <div class="resp-toggle" onclick="toggleResp(this)">
        <span class="arrow">▶</span> Ver respuesta sugerida
      </div>
      <div class="resp-box">${escHtml(r.ai_response)}</div>` : '';

    return `
    <div class="review-card${r.respondida ? ' respondida' : ''}" id="card-${r.id}">
      <div class="review-header">
        <div>
          <div class="review-author">${escHtml(r.reviewer || 'Anónimo')}</div>
          <div class="review-date">${fecha}</div>
        </div>
        <div class="review-stars">${stars}</div>
      </div>
      <span class="badge ${badgeClass}">${badgeText}</span>
      ${r.respondida ? '<span class="badge badge-respondida" style="margin-left:6px">respondida</span>' : ''}
      ${texto}
      ${respAccordion}
      <div class="card-actions">
        ${respondBtn}
        <button class="${doneBtnClass}" id="btn-${r.id}" onclick="toggleRespondida(${r.id}, ${r.respondida})">${doneText}</button>
      </div>
    </div>`;
  }

  function toggleResp(el) {
    el.classList.toggle('open');
    el.nextElementSibling.classList.toggle('open');
  }

  // ── Load stats ────────────────────────────────────────────
  async function loadStats() {
    // Rating medio
    if (allReviews.length) {
      const avg = allReviews.reduce((s, r) => s + (r.rating || 0), 0) / allReviews.length;
      document.getElementById('stat-rating').textContent = avg.toFixed(1) + '★';
      document.getElementById('stat-reviews').textContent = allReviews.length;
    }
    // Scans NFC últimos 7 días
    try {
      const since = new Date(Date.now() - 7 * 864e5).toISOString();
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/scans?bar_id=eq.${BAR_ID}&timestamp=gte.${since}&select=id`,
        { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, Prefer: 'count=exact' } }
      );
      const count = res.headers.get('content-range')?.split('/')[1] || '0';
      document.getElementById('stat-scans').textContent = count;
    } catch(e) {}
  }

  // ── Tabs ──────────────────────────────────────────────────
  function setTab(el, tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    activeTab = tab;
    renderReviews();
  }

  // ── Copiar y responder ────────────────────────────────────
  async function copiarYResponder(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch(e) {
      // Fallback iOS Safari
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    showToast('✓ Respuesta copiada — abriendo Google Business...');
    setTimeout(() => window.open('https://business.google.com/reviews', '_blank'), 900);
  }

  // ── Marcar respondida ─────────────────────────────────────
  async function toggleRespondida(id, actual) {
    const nuevo = !actual;
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/reviews?id=eq.${id}`, {
        method: 'PATCH',
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          Prefer: 'return=minimal'
        },
        body: JSON.stringify({ respondida: nuevo })
      });
      // Actualizar local
      const idx = allReviews.findIndex(r => r.id === id);
      if (idx !== -1) allReviews[idx].respondida = nuevo;
      renderReviews();
      showToast(nuevo ? '✓ Marcada como respondida' : 'Marcada como pendiente');
    } catch(e) {
      showToast('Error al actualizar');
    }
  }

  // ── Toast ─────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ── Helpers ───────────────────────────────────────────────
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function escAttr(s) {
    return String(s).replace(/'/g, "\\'").replace(/\n/g, ' ');
  }

  // ── Start ─────────────────────────────────────────────────
  init();
</script>
</body>
</html>
